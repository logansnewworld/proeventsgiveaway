<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expo Admin - Prize Ticker Tube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .ticker-window {
            height: 120px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(to bottom, #111827, #1f2937, #111827);
            border-top: 4px solid #f59e0b;
            border-bottom: 4px solid #f59e0b;
        }
        .ticker-track {
            position: absolute;
            width: 100%;
            transition: transform 0.1s linear;
        }
        .ticker-item {
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            padding: 0 20px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 text-white min-h-screen p-6 flex flex-col items-center justify-between relative">
    
    <!-- Fullscreen Toggle Button -->
    <button onclick="toggleFullscreen()" class="fixed top-4 right-4 bg-gray-800 hover:bg-gray-700 text-yellow-400 font-bold py-2 px-4 rounded-lg border border-yellow-500 shadow-lg transition z-50">
        ⛶ Fullscreen
    </button>

    <!-- Header Section -->
    <div class="flex flex-col items-center">
        <img src="logo.png" alt="Company Logo" class="h-20 object-contain mb-2 drop-shadow-md">
        <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 bg-clip-text text-transparent mb-2">
            GRAND PRIZE TICKER TUBE
        </h1>
    </div>

    <!-- Spinning Tube / Ticker Box -->
    <div class="w-full max-w-2xl my-4 shadow-[0_0_50px_rgba(245,158,11,0.3)] rounded-2xl overflow-hidden border-2 border-yellow-500">
        <div class="ticker-window">
            <div id="tickerTrack" class="ticker-track">
                <div class="ticker-item text-3xl font-black text-amber-400">READY TO SPIN...</div>
            </div>
        </div>
    </div>

    <!-- Action Button -->
    <button id="actionBtn" onclick="toggleSpin()" class="bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600 hover:from-yellow-300 hover:to-amber-500 text-black font-black text-2xl py-4 px-12 rounded-full shadow-[0_10px_25px_rgba(245,158,11,0.4)] transition transform hover:scale-105 active:scale-95 border-2 border-yellow-200 mb-4">
        🚀 START ROLLING
    </button>

    <!-- Winner Announcement Banner -->
    <div id="winnerDisplay" class="hidden bg-gray-800/95 backdrop-blur-md p-6 rounded-2xl border-2 border-yellow-500 text-center max-w-lg w-full shadow-[0_0_30px_rgba(234,179,8,0.3)] mb-4">
        <h2 class="text-yellow-400 text-base font-extrabold tracking-widest uppercase mb-1">🎉 WINNER SELECTED! 🎉</h2>
        <div id="winnerName" class="text-4xl font-black text-white mb-2"></div>
        <div id="winnerDetails" class="text-gray-200 text-xl font-semibold"></div>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert(err.message));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        const SUPABASE_URL = 'https://kvweqztviovppnuniqpu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_bCHzdDByUR1IX7RmqpMGqQ_w5ewnov1';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let leads = [];
        let isSpinning = false;
        let rollInterval = null;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTick() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.04);
        }

        function playWinFanfare() {
            const ctx = getAudioContext();
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
                gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12);
                gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + i * 0.12 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.7);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime + i * 0.12); osc.stop(ctx.currentTime + i * 0.12 + 0.7);
            });
        }

        async function toggleSpin() {
            const actionBtn = document.getElementById('actionBtn');
            const winnerDisplay = document.getElementById('winnerDisplay');
            const track = document.getElementById('tickerTrack');

            if (!isSpinning) {
                // START SPINNING
                winnerDisplay.classList.add('hidden');
                actionBtn.disabled = true;
                actionBtn.textContent = 'FETCHING ENTRIES...';

                // Fetches all entries without date restrictions
                const { data, error } = await supabaseClient.from('expo_leads').select('*');

                if (error || !data || data.length === 0) {
                    alert('No entries found in database!');
                    actionBtn.disabled = false;
                    actionBtn.textContent = '🚀 START ROLLING';
                    return;
                }

                leads = data;
                
                // Populate track with Name + Company
                let html = '';
                const displayList = [...leads, ...leads, ...leads]; 
                displayList.forEach(l => {
                    const name = l.full_name || 'Anonymous';
                    const comp = l.company ? `(${l.company})` : '';
                    html += `
                        <div class="ticker-item">
                            <div class="text-3xl font-black text-amber-400">${name}</div>
                            <div class="text-lg font-medium text-gray-300 mt-1">${comp}</div>
                        </div>
                    `;
                });
                track.innerHTML = html;

                isSpinning = true;
                actionBtn.disabled = false;
                actionBtn.textContent = '🛑 STOP & PICK WINNER';

                let currentIndex = 0;
                rollInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % displayList.length;
                    track.style.transform = `translateY(-${currentIndex * 120}px)`;
                    playTick();
                }, 75);

            } else {
                // STOP SPINNING & CHOOSE WINNER
                clearInterval(rollInterval);
                isSpinning = false;
                actionBtn.disabled = true;
                actionBtn.textContent = 'CHOOSING...';

                const winnerIndex = Math.floor(Math.random() * leads.length);
                const winner = leads[winnerIndex];

                const winnerName = winner.full_name || 'Anonymous';
                const winnerCompany = winner.company ? winner.company : '';

                // Snap ticker to show winning name and company
                track.innerHTML = `
                    <div class="ticker-item">
                        <div class="text-3xl font-black text-green-400">⭐ ${winnerName} ⭐</div>
                        <div class="text-lg font-medium text-gray-200 mt-1">${winnerCompany}</div>
                    </div>
                `;
                track.style.transform = `translateY(0px)`;

                setTimeout(() => {
                    playWinFanfare();
                    document.getElementById('winnerName').textContent = winnerName;
                    document.getElementById('winnerDetails').textContent = winnerCompany;
                    winnerDisplay.classList.remove('hidden');
                    actionBtn.disabled = false;
                    actionBtn.textContent = '🚀 START ROLLING';
                }, 600);
            }
        }
    </script>
</body>
</html>
